<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/card.css">
</head>
<body>
    <div class="product-card">
        <img class= "product-card__image" src="assets/images/image 16.png" >

        <div class="product-card__content">
            <div class="product-card__header">
                <div class="product-card__title">
                    <span class="product-card__item-name">Classic Cheeseburger</span>
                    <span class="product-card__price">$4.99</span>
                </div>
                <span class="product-card__description">
                Ground beef, Cheese, Burger bun, Lettuce, Egg, Pickled cucumbers, Sliced tomatoes.
            </span>
            </div>

            <div class="product-card__buttons">
                <div class="product-card__stepper-buttons">
                    <button class="stepper-button decrement-stepper-button"></button>
                    <span class="items-count">4</span>
                    <button class="stepper-button increment-stepper-button"></button>
                </div>

                <button class="purchase-button">Buy now</button>


            </div>
        </div>


    </div>

</body>
</html>
